name: TF26 GAS quality gate
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and authorization regression
        run: node --test src/server/*.test.cjs tests/*.test.cjs
      - name: GAS bundle V8 validation
        run: node scripts/build-gas.cjs
      - name: Inline client JavaScript syntax
        run: |
          node -e 'const fs=require("node:fs"),vm=require("node:vm");const s=fs.readFileSync("dist/gas/Index.html","utf8");const m=s.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw Error("Missing inline script");new vm.Script(m[1].replace("<"+"?!= publicConfig ?"+">","{}"),{filename:"Index.html"});console.log("Client syntax PASS")'
